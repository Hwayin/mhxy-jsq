buildscript {
    def local = new Properties()
    file('local.properties').withInputStream { local.load(it) }
    def sdk = local.getProperty('dcloud.sdk.dir')
    dependencies {
        classpath files("${sdk}/plugins/uts-kotlin-compiler-plugin-0.0.1.jar")
        classpath files("${sdk}/plugins/uts-kotlin-gradle-plugin-0.0.1.jar")
        classpath files("${sdk}/plugins/auto-register-gradle-plugin-1.0.0.jar")
    }
}
plugins {
    id 'com.android.application' version '9.0.1' apply false
}
